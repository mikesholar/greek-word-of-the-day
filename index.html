<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Greek Word of the Day</title>
    <meta name="description" content="Learn one of the 1000 most common Greek words each day." />
    <meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1c2b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow" lang="el">Λέξη της ημέρας</p>
        <h1>Greek word of the day</h1>
      </header>

      <nav class="day-nav" aria-label="Choose a day">
        <button type="button" class="nav-btn" id="prev" aria-label="Previous day">‹</button>
        <div class="day-label">
          <span class="day-kind" id="day-kind"></span>
          <time id="date"></time>
          <button type="button" class="today-link" id="today" hidden>Back to today</button>
        </div>
        <button type="button" class="nav-btn" id="next" aria-label="Next day">›</button>
      </nav>

      <section class="card-wrap">
        <button type="button" class="card" id="card" aria-live="polite">
          <span class="face front">
            <span class="hint">English</span>
            <span class="en" id="en"></span>
            <span class="note" id="note"></span>
            <span class="tap">Tap to reveal the Greek</span>
          </span>
          <span class="face back">
            <span class="hint">Greek</span>
            <span class="el" id="el" lang="el"></span>
            <span class="tr" id="tr"></span>
            <span class="forms" id="forms" lang="el"></span>
            <span class="tap">Tap to flip back</span>
          </span>
        </button>
        <button type="button" class="speak" id="speak" hidden>
          <span aria-hidden="true">🔊</span> Hear it
        </button>
      </section>

      <p class="count" id="count"></p>
    </main>

    <footer class="footer">
      Words from the free
      <a href="https://flashcardo.com/greek-flashcards" rel="noopener">Flashcardo</a>
      1000 English–Greek flashcards.
    </footer>
  </body>
</html>
